# The share relay: turns a shared cheat into a pull request on darkharasho/starlight.
# Before the first deploy: create the KV namespace (pull requests by cheat hash) and fill in its id, set the
# App and installation ids, and `wrangler secret put GITHUB_APP_KEY` (PKCS#8 PEM).
name = "starlight-share"
main = "src/index.ts"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]

[vars]
GITHUB_OWNER = "darkharasho"
GITHUB_REPO = "starlight"
GITHUB_APP_ID = "5932101"
GITHUB_INSTALLATION_ID = "186016614"

[[kv_namespaces]]
binding = "SHARE_KV"
id = "15a49e29bae04cceab813a1cf7ea7646"

# Daily submission limits: one Durable Object counts every submission.
[[durable_objects.bindings]]
name = "LIMITER"
class_name = "RateLimiter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RateLimiter"]
