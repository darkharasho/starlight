# The share relay: turns a shared cheat into a pull request on darkharasho/starlight.
# Before the first deploy: create the KV namespace and fill in its id, set the
# App and installation ids, and `wrangler secret put GITHUB_APP_KEY` (PKCS#8 PEM).
name = "starlight-share"
main = "src/index.ts"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]

[vars]
GITHUB_OWNER = "darkharasho"
GITHUB_REPO = "starlight"
GITHUB_APP_ID = ""
GITHUB_INSTALLATION_ID = ""

[[kv_namespaces]]
binding = "SHARE_KV"
id = "REPLACE_WITH_KV_NAMESPACE_ID"
