name: Community cheat check
on:
  pull_request:
    paths: ['packages/catalog/community/**']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: pnpm }
      - run: pnpm install --frozen-lockfile --filter @starlight/catalog...
      - run: pnpm --filter @starlight/ct-importer build && pnpm --filter @starlight/catalog build
      - run: node scripts/check-community-pr.mjs
